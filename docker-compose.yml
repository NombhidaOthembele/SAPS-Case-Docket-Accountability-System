version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saps-docket-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
    networks:
      - saps-network

  postgres:
    image: postgres:15-alpine
    container_name: saps-docket-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saps_docket_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - saps-network

  redis:
    image: redis:7-alpine
    container_name: saps-docket-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - saps-network

volumes:
  postgres_data:
  redis_data:

networks:
  saps-network:
    driver: bridge
